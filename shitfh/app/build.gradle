plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.zygisk.imgui.menu'

    defaultConfig {
        applicationId "com.zygisk.imgui.menu"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fdata-sections -ffunction-sections"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

// Universal Magisk Module packaging task
tasks.register('packageMagiskModule', Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "zygisk-imgui-menu-v1.0.0.zip"
    destinationDirectory = file("$buildDir/outputs/zip")

    // Root properties and setup
    from("${project.rootDir}/module.prop")
    from("${project.rootDir}/customize.sh")
    from("${project.rootDir}/META-INF") {
        into("META-INF")
    }

    // Dynamic resolution of stripped native shared libraries
    def intermediatesDir = file("$buildDir/intermediates")

    // Package 64-bit ABI (arm64-v8a)
    from(fileTree(dir: intermediatesDir, includes: ["**/arm64-v8a/libzygisk.so"])) {
        into "zygisk"
        rename "libzygisk.so", "arm64-v8a.so"
        eachFile { it.path = "zygisk/arm64-v8a.so" }
    }
    from(fileTree(dir: intermediatesDir, includes: ["**/arm64-v8a/libzygisk.so"])) {
        into "zygisk/arm64-v8a"
        eachFile { it.path = "zygisk/arm64-v8a/libzygisk.so" }
    }

    // Package 32-bit ABI (armeabi-v7a)
    from(fileTree(dir: intermediatesDir, includes: ["**/armeabi-v7a/libzygisk.so"])) {
        into "zygisk"
        rename "libzygisk.so", "armeabi-v7a.so"
        eachFile { it.path = "zygisk/armeabi-v7a.so" }
    }
    from(fileTree(dir: intermediatesDir, includes: ["**/armeabi-v7a/libzygisk.so"])) {
        into "zygisk/armeabi-v7a"
        eachFile { it.path = "zygisk/armeabi-v7a/libzygisk.so" }
    }
}

tasks.matching { it.name == 'assembleRelease' || it.name == 'build' }.configureEach {
    finalizedBy 'packageMagiskModule'
}
