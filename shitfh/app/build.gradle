plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fdata-sections -ffunction-sections"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

task zipModule(type: Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "zygisk-imgui-menu-v1.0.0.zip"
    destinationDirectory = file("$buildDir/outputs/zip")

    // Include module files
    from("${projectDir}/src/main/module") {
        include 'module.prop'
        include 'customize.sh'
    }

    // Pack compiled native shared libraries into standard Zygisk layout structures
    doFirst {
        def abis = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86']
        abis.each { abi ->
            def possiblePaths = [
                file("$buildDir/intermediates/stripped_native_libs/release/out/lib/$abi/libzygisk.so"),
                file("$buildDir/intermediates/cmake/release/obj/$abi/libzygisk.so"),
                file("$buildDir/intermediates/cxx/Release/${abi}/libzygisk.so")
            ]
            def libFile = possiblePaths.find { it.exists() }
            if (libFile) {
                from(libFile.parentFile) {
                    include "libzygisk.so"
                    into "zygisk/$abi"
                }
                from(libFile) {
                    into "zygisk"
                    rename "libzygisk.so", "${abi}.so"
                }
            }
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease' || task.name == 'assemble') {
        task.finalizedBy zipModule
    }
}
