plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    namespace 'com.universal.zygisk.imgui'

    defaultConfig {
        minSdk 21
        targetSdk 33
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1+"
        }
    }

    packagingOptions {
        exclude '**/*'
    }
}

tasks.register('packageMagiskModule', Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "zygisk-imgui-menu.zip"
    destinationDirectory = file("${buildDir}/outputs")

    // Root module metadata files
    from("${project.rootDir}/module") {
        include 'module.prop'
        include 'customize.sh'
    }

    doFirst {
        def stagingDir = file("${buildDir}/tmp/zip_staging")
        stagingDir.mkdirs()

        ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].each { abi ->
            def filesFound = fileTree(dir: buildDir, include: "**/libzygisk.so").filter { f ->
                f.path.contains(abi)
            }
            if (!filesFound.isEmpty()) {
                def soFile = filesFound.first()
                println "Packing Zygisk binary for ABI [${abi}]: ${soFile.path}"

                // Copy to zygisk/<abi>/libzygisk.so
                copy {
                    from soFile
                    into "${buildDir}/tmp/zip_staging/zygisk/${abi}"
                }
                // Copy to zygisk/<abi>.so for backwards compatibility
                copy {
                    from soFile
                    into "${buildDir}/tmp/zip_staging/zygisk"
                    rename "libzygisk.so", "${abi}.so"
                }
            }
        }
    }

    from("${buildDir}/tmp/zip_staging")
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'packageMagiskModule'
}
