plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 34
        versionCode 1000
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden -fdata-sections -ffunction-sections"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        exclude '**/*.so'
    }
}

tasks.register('packageMagiskModule', Zip) {
    dependsOn 'externalNativeBuildRelease', 'assembleRelease'

    archiveFileName = "zygisk-imgui-universal.zip"
    destinationDirectory = file("${project.rootDir}/out")

    // Stage static module files
    from("${project.rootDir}/module") {
        into ""
    }

    doFirst {
        def stageDir = file("${project.buildDir}/zygisk_stage")
        stageDir.mkdirs()

        // Copy built libzygisk.so binaries into both zygisk/<abi>/libzygisk.so and zygisk/<abi>.so
        fileTree(dir: "${project.buildDir}/intermediates", include: "**/libzygisk.so").each { soFile ->
            def abi = soFile.parentFile.name
            if (["arm64-v8a", "armeabi-v7a", "x86", "x86_64"].contains(abi)) {
                // Format 1: zygisk/<abi>/libzygisk.so
                copy {
                    from soFile
                    into "${stageDir}/zygisk/${abi}"
                }
                // Format 2: zygisk/<abi>.so
                copy {
                    from soFile
                    into "${stageDir}/zygisk"
                    rename { "${abi}.so" }
                }
            }
        }
    }

    from("${project.buildDir}/zygisk_stage") {
        into ""
    }

    doLast {
        println "SUCCESS: Created Magisk Zygisk Zip at ${destinationDirectory.get()}/${archiveFileName.get()}"
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        finalizedBy 'packageMagiskModule'
    }
}
