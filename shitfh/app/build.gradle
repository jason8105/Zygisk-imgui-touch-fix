plugins {
    id 'com.android.application'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui.touchfix"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_static"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        exclude '**/*.so'
    }
}

task zipModule(type: Zip) {
    archiveFileName = "zygisk-imgui-touch-fix.zip"
    destinationDirectory = file("${project.rootDir}/out")

    dependsOn 'assembleRelease'

    from("${project.rootDir}/module.prop")
    from("${project.rootDir}/customize.sh")

    def abis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    abis.each { abi ->
        from("${buildDir}/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib/${abi}") {
            into "zygisk/${abi}"
            include "libzygisk.so"
        }
        from("${buildDir}/intermediates/merged_native_libs/release/out/lib/${abi}") {
            into "zygisk/${abi}"
            include "libzygisk.so"
        }
        from("${buildDir}/intermediates/cmake/release/obj/${abi}") {
            into "zygisk/${abi}"
            include "libzygisk.so"
        }
        from("${buildDir}/native_libs/${abi}") {
            into "zygisk/${abi}"
            include "libzygisk.so"
        }
    }
}

afterEvaluate {
    tasks.named("assembleRelease").configure {
        finalizedBy("zipModule")
    }
}
