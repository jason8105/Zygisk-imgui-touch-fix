plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imguimenu'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imguimenu"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

task packageMagiskModule(type: Zip) {
    dependsOn 'externalNativeBuildRelease', 'assembleRelease'

    archiveFileName = "zygisk-module.zip"
    destinationDirectory = file("$buildDir/outputs")

    // Include Magisk module definition
    from(file("${projectDir}/../module")) {
        include 'module.prop'
        include 'service.sh'
    }

    // Include compiled libzygisk.so binaries into zip under zygisk/<abi>/libzygisk.so and zygisk/<abi>.so
    def abis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    abis.each { abi ->
        def baseDir = file("$buildDir/intermediates/stripped_native_libs/release/out/lib/${abi}")
        if (!baseDir.exists()) {
            baseDir = file("$buildDir/intermediates/merged_native_libs/release/out/lib/${abi}")
        }
        from(baseDir) {
            include 'libzygisk.so'
            into "zygisk/${abi}"
        }
        from(baseDir) {
            include 'libzygisk.so'
            into "zygisk"
            rename 'libzygisk.so', "${abi}.so"
        }
    }
}

tasks.afterEvaluate {
    tasks.named('assembleRelease').configure {
        finalizedBy 'packageMagiskModule'
    }
}
