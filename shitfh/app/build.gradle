plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        resources {
            excludes += ['**/*']
        }
    }
}

tasks.register('zip', Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "zygisk-imgui-menu.zip"
    destinationDirectory = file("${buildDir}/outputs/zip")

    from("${project.rootDir}/module") {
        include 'module.prop'
        include 'customize.sh'
    }

    into('zygisk') {
        from("${buildDir}/intermediates/cmake/release/obj/arm64-v8a") {
            include 'libzygisk.so'
            rename 'libzygisk.so', 'arm64-v8a.so'
        }
        from("${buildDir}/intermediates/cmake/release/obj/armeabi-v7a") {
            include 'libzygisk.so'
            rename 'libzygisk.so', 'armeabi-v7a.so'
        }
        from("${buildDir}/intermediates/stripped_native_libs/release/out/lib/arm64-v8a") {
            include 'libzygisk.so'
            rename 'libzygisk.so', 'arm64-v8a.so'
        }
        from("${buildDir}/intermediates/stripped_native_libs/release/out/lib/armeabi-v7a") {
            include 'libzygisk.so'
            rename 'libzygisk.so', 'armeabi-v7a.so'
        }
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        finalizedBy 'zip'
    }
}
