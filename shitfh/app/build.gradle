plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1"
        }
    }
}

dependencies {
    // No extra java dependencies needed
}

// Magisk module packager task
task zipModule(type: Zip) {
    archiveFileName = "zygisk-universal-imgui.zip"
    destinationDirectory = file("$rootDir/out")

    // Copy template module prop and files
    from("$rootDir/template") {
        include "**/*"
    }

    // Map each compiled .so to the Zygisk directories
    def buildType = "release"
    def nativeOutDir = file("$buildDir/intermediates/stripped_native_libs/${buildType}/out/lib")

    // Wait for the build task to run first
    dependsOn "assembleRelease"

    into("zygisk") {
        from(nativeOutDir) {
            include "**/libzygisk.so"
        }
    }
}

// Always clean output directory before zip
zipModule.doFirst {
    file("$rootDir/out").mkdirs()
}
