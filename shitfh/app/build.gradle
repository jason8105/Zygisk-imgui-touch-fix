plugins {
    id 'com.android.library'
}

android {
    namespace 'com.universal.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fvisibility-inlines-hidden"
                abiFilters "arm64-v8a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

import java.io.FileOutputStream
import java.util.zip.ZipOutputStream
import java.util.zip.ZipEntry

task zipModule(dependsOn: 'assembleRelease') {
    doLast {
        def zipFile = file("${buildDir}/outputs/zygisk-imgui-menu.zip")
        zipFile.parentFile.mkdirs()
        
        def zipOutputStream = new ZipOutputStream(new FileOutputStream(zipFile))
        
        // Add static Magisk files
        def magiskFilesDir = file("${projectDir}/src/main/magisk")
        if (magiskFilesDir.exists()) {
            magiskFilesDir.eachFileRecurse { File file ->
                if (file.isFile()) {
                    def relativePath = magiskFilesDir.toURI().relativize(file.toURI()).getPath()
                    zipOutputStream.putNextEntry(new ZipEntry(relativePath))
                    file.withInputStream { zipOutputStream << it }
                    zipOutputStream.closeEntry()
                }
            }
        } else {
            throw new GradleException("Magisk files directory not found at ${magiskFilesDir.absolutePath}")
        }
        
        // Search and add libzygisk.so for all ABIs
        def intermediatesDir = file("${buildDir}/intermediates")
        def foundLibs = false
        if (intermediatesDir.exists()) {
            intermediatesDir.eachFileRecurse { File file ->
                if (file.isFile() && file.name == "libzygisk.so") {
                    if (file.absolutePath.contains("stripped_native_libs") && file.absolutePath.contains("release")) {
                        def abi = file.parentFile.name
                        zipOutputStream.putNextEntry(new ZipEntry("zygisk/${abi}/libzygisk.so"))
                        file.withInputStream { zipOutputStream << it }
                        zipOutputStream.closeEntry()
                        foundLibs = true
                        println "Added to zip: zygisk/${abi}/libzygisk.so from ${file.absolutePath}"
                    }
                }
            }
        }
        
        // Fallback search if stripped_native_libs is not populated or in a different structure
        if (!foundLibs && intermediatesDir.exists()) {
            intermediatesDir.eachFileRecurse { File file ->
                if (file.isFile() && file.name == "libzygisk.so" && !file.absolutePath.contains("intermediates/transforms") && file.absolutePath.contains("release")) {
                    def abi = file.parentFile.name
                    if (["arm64-v8a", "armeabi-v7a"].contains(abi)) {
                        zipOutputStream.putNextEntry(new ZipEntry("zygisk/${abi}/libzygisk.so"))
                        file.withInputStream { zipOutputStream << it }
                        zipOutputStream.closeEntry()
                        foundLibs = true
                        println "Fallback added to zip: zygisk/${abi}/libzygisk.so from ${file.absolutePath}"
                    }
                }
            }
        }
        
        zipOutputStream.close()
        if (!foundLibs) {
            throw new GradleException("Could not find any compiled libzygisk.so binaries to package!")
        }
        println "Successfully created universal flashable Zygisk module zip: ${zipFile.absolutePath}"
    }
}
