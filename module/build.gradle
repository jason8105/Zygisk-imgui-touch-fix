plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fdata-sections -ffunction-sections"
                arguments "-DANDROID_STL=c++_static"
                abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            excludes += ['**/*']
        }
    }
}

tasks.register('zip', Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName.set("zygisk-imgui-touchfix.zip")
    destinationDirectory.set(file("${rootProject.buildDir}/outputs"))

    // Copy module scripts & metadata
    from("${projectDir}/src/main/module")

    // Package libzygisk.so for each target ABI
    def abis = ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]
    abis.each { abi ->
        into("zygisk/${abi}") {
            from("${projectDir}/src/main/module/zygisk/${abi}")
            from("${buildDir}/intermediates/cxx/Release") {
                include "**/obj/${abi}/libzygisk.so"
                eachFile { path = "libzygisk.so" }
            }
            from("${buildDir}/intermediates/stripped_native_libs/release/out/lib/${abi}")
            from("${buildDir}/intermediates/merged_native_libs/release/out/lib/${abi}")
            from("${buildDir}/intermediates/cmake/release/obj/${abi}")
            from("${buildDir}/zygisk_libs/${abi}")
            include "libzygisk.so"
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
    }
}

tasks.named('assemble').configure {
    finalizedBy 'zip'
}
