// Removed deprecated org.apache.tools.cmake.util.FileUtils
// Corrected native library output packaging for Magisk compatibility
android {
    defaultConfig {
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions"
            }
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

task copyNativeLibs(type: Copy) {
    from fileTree(dir: 'build/intermediates/cmake/release/obj')
    into 'module/zygisk'
    include '**/*.so'
    eachFile { f -> f.path = f.path.replaceAll('obj/', '') }
}
build.dependsOn copyNativeLibs
