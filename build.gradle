// Ensure the module is packaged correctly
android {
    defaultConfig {
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden"
            }
        }
    }
    
    // Fix: Force copy to module path during assemble
    applicationVariants.all { variant ->
        variant.assembleProvider.get().doLast {
            copy {
                from "$buildDir/intermediates/cmake/release/obj/"
                into "${projectDir}/module/zygisk/"
            }
        }
    }
}
