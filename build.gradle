```gradle
android {
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    
    // Ensure binary is placed exactly where the module requires
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "libzygisk.so"
        }
    }
}

task createMagiskModule(type: Zip) {
    from('module_template')
    from('build/intermediates/cmake/release/obj') {
        into 'zygisk'
    }
    archiveFileName = "MyModule_v1.zip"
    destinationDirectory = file('dist')
}
```
