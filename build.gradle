plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        minSdk 24
        targetSdk 33
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17", "-fvisibility=hidden", "-fomit-frame-pointer", "-O3"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

android.libraryVariants.all { variant ->
    def variantName = variant.name.capitalize()
    task "zipModule${variantName}"(type: Zip) {
        dependsOn "externalNativeBuild${variantName}"
        
        archiveFileName = "Zygisk-ImGui-Universal-${variant.name}.zip"
        destinationDirectory = file("$buildDir/outputs/zip")

        from("module.prop")
        
        // Correct Magisk Zygisk structure: zygisk/<abi>.so
        variant.externalNativeBuildTasks.each { task ->
            def outDir = task.objFolder
            ['arm64-v8a', 'armeabi-v7a'].each { abi ->
                from("${outDir}/${abi}/libzygisk.so") {
                    into "zygisk"
                    rename { "${abi}.so" }
                }
            }
        }
        
        // Include dummy folders for Magisk compatibility
        into('system') {
            from { new File(buildDir, 'tmp/empty').mkdirs(); buildDir.resolve('tmp/empty') }
        }
    }
}
