plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        minSdk 24
        targetSdk 33
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fno-rtti -fno-exceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1+'
        }
    }
}

task buildMagiskModule(type: Zip, dependsOn: ['assembleRelease']) {
    archiveFileName = 'zygisk-imgui-release.zip'
    destinationDirectory = file("$buildDir/outputs/magisk")

    from("$projectDir/src/main/magisk") {
        include 'module.prop'
        include 'post-fs-data.sh'
        include 'service.sh'
        include 'action.sh'
    }

    // Explicitly package compiled native libraries into correct Zygisk module subpaths
    into("zygisk") {
        from("$buildDir/intermediates/cmake/release/obj") {
            include "armeabi-v7a/libzygisk.so"
            include "arm64-v8a/libzygisk.so"
            include "x86/libzygisk.so"
            include "x86_64/libzygisk.so"
        }
    }
}

tasks.named('assembleRelease').configure {
    finalizedBy('buildMagiskModule')
}
