plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zygisk.imguitouchfix'
    compileSdk 33

    defaultConfig {
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.18.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

task buildMagiskModule(type: Zip, dependsOn: 'assembleRelease') {
    archiveFileName = 'zygisk-imgui-touch-fix.zip'
    destinationDirectory = file("$buildDir/outputs/magisk")

    // Create standard Magisk module layout
    from('src/main/magisk')
    
    // Include built native library for arm64-v8a
    from("$buildDir/intermediates/cmake/release/obj/arm64-v8a/libzygisk_imgui.so") {
        into 'zygisk'
    }
}

// Hook into build to make zip automatically
tasks.whenTaskAdded { task ->
    if (task.name == 'bundleReleaseAar' || task.name == 'assembleRelease') {
        task.finalizedBy('buildMagiskModule')
    }
}
