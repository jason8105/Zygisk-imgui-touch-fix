plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    defaultConfig {
        minSdk 24
        targetSdk 34
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }
    // Fix for build environment compatibility
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:deprecation"
        }
    }
}

task zipModule(type: Zip) {
    from 'module_template/'
    from('build/intermediates/cmake/release/obj/') {
        into 'lib/arm64-v8a/'
    }
    archiveFileName = "Zygisk-ImGui-Module.zip"
    destinationDirectory = file("build/outputs/magisk/")
}
