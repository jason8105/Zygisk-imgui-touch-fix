// Root gradle to ensure task ordering
task copyLibs(type: Copy) {
    from 'app/build/intermediates/cmake/release/obj'
    into 'magisk_module/zygisk'
    include '**/*.so'
}

task packageModule(type: Zip) {
    archiveFileName = "UniversalTouchFix.zip"
    destinationDirectory = file('build/outputs')
    from 'magisk_module'
    from ('app/build/intermediates/cmake/release/obj') {
        into 'zygisk'
    }
}
