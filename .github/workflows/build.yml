name: Build Zygisk ImGui Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Build with Gradle (Debug)
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Prepare Magisk Module Package
      run: |
        mkdir -p final_package
        # Locate the built module zip or assemble from debug build output
        if [ -d "app/build/outputs/apk/debug" ]; then
          cp app/build/outputs/apk/debug/*.apk final_package/Zygisk-ImGui-Module.zip
        elif [ -d "app/build/intermediates/cmake/debug/obj" ]; then
          mkdir -p zygisk/arm64-v8a zygisk/armeabi-v7a
          cp -r app/build/intermediates/cmake/debug/obj/* zygisk/ 2>/dev/null || true
          zip -r final_package/Zygisk-ImGui-Module.zip module.prop customize.sh zygisk/
        elif [ -d "out" ]; then
          cd out
          zip -r ../final_package/Zygisk-ImGui-Module.zip .
          cd ..
        else
          # Fallback: package module directly if structure exists in root
          zip -r final_package/Zygisk-ImGui-Module.zip module.prop customize.sh zygisk/ || true
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zygisk-ImGui-Module
        path: final_package/*.zip
