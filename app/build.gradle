plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    namespace 'com.zygisk.imgui'

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 33
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fdata-sections -ffunction-sections"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1"
        }
    }

    packagingOptions {
        exclude '**/*.so'
    }
}

task packageZygiskModule(type: Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "zygisk_imgui_menu.zip"
    destinationDirectory = file("${buildDir}/outputs/zip")

    from("${rootDir}/module") {
        include "module.prop"
        include "customize.sh"
        include "service.sh"
    }

    ['arm64-v8a', 'armeabi-v7a'].each { abi ->
        from("${projectDir}/build/zygisk_libs/${abi}") {
            include "libzygisk.so"
            into "zygisk/${abi}"
        }
    }
}

afterEvaluate {
    if (tasks.findByName('assembleRelease')) {
        tasks.named('assembleRelease').configure {
            finalizedBy packageZygiskModule
        }
    }
}
