plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zygisk.imgui.touchfix'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndkVersion "25.2.9519653"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}

// Custom task to package the compiled .so files and module assets into a flashable Magisk module zip
task buildMagiskModule(type: Zip, dependsOn: 'bundleReleaseAar') {
    archiveFileName = 'zygisk_imgui_touch_fix_magisk.zip'
    destinationDirectory = file("$buildDir/outputs/magisk")

    from("${rootDir}/../module.prop")
    from("${rootDir}/../customize.sh")
    
    // Include compiled native libraries from external native build outputs
    into("system/lib64") {
        from("${buildDir}/intermediates/cmake/release/obj/arm64-v8a")
        include("libzygisk_imgui.so")
    }
    into("system/lib") {
        from("${buildDir}/intermediates/cmake/release/obj/armeabi-v7a")
        include("libzygisk_imgui.so")
    }
}

tasks.named('assembleRelease').configure {
    finalizedBy('buildMagiskModule')
}
