plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 34
        versionCode 1000
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

task packageMagiskModule(type: Zip) {
    dependsOn 'assembleRelease'

    archiveFileName = "Zygisk-ImGui-Menu-v1.0.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    from("${project.rootDir}/module") {
        include 'module.prop'
        include 'customize.sh'
        include 'service.sh'
    }

    def nativeLibsDir = file("$buildDir/intermediates/stripped_native_libs/release/out/lib")

    into('zygisk') {
        from(nativeLibsDir) {
            include '**/libzygisk.so'
            eachFile { f ->
                def abi = f.path.split('/')[0]
                f.path = "${abi}.so"
            }
        }
    }

    into('zygisk') {
        from(nativeLibsDir) {
            include '**/libzygisk.so'
        }
    }
}

tasks.matching { it.name == 'assembleRelease' || it.name == 'assemble' }.configureEach {
    finalizedBy packageMagiskModule
}
