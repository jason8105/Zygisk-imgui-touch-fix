plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

task zipModule(type: Zip) {
    archiveFileName = "zygisk_imgui_module.zip"
    destinationDirectory = file("${project.rootDir}/out")

    from("${project.rootDir}/module.prop")
    if (file("${project.rootDir}/service.sh").exists()) {
        from("${project.rootDir}/service.sh")
    }

    def abis = ['arm64-v8a', 'armeabi-v7a']
    abis.each { abi ->
        into("zygisk/${abi}") {
            from(fileTree(dir: "${buildDir}/intermediates", include: "**/lib/${abi}/libzygisk.so")) {
                eachFile { path = "libzygisk.so" }
            }
            from(fileTree(dir: "${buildDir}/intermediates/cmake", include: "**/${abi}/libzygisk.so")) {
                eachFile { path = "libzygisk.so" }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("assemble")) {
        task.finalizedBy(zipModule)
    }
}
