plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

// Task to assemble the compiled native libraries into a flashable Magisk Zygisk module zip
task buildZygiskModule(type: Zip, dependsOn: ['assembleRelease']) {
    archiveFileName = "Zygisk-ImGui-TouchFix-Module.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    def strippedDir = "$buildDir/intermediates/merged_native_libs/release/out/lib"
    
    // Fallback directory if merged_native_libs differs across AGP versions
    from("$buildDir/intermediates/cmake/release/obj") {
        into "zygisk"
    }
    
    // Include module configuration files
    from("src/main/magisk") {
        include "module.prop"
        include "service.sh"
        include "post-fs-data.sh"
        include "action.sh"
    }
}

tasks.named('build').configure {
    finalizedBy('buildZygiskModule')
}
