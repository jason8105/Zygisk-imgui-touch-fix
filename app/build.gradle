plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui.menu'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui.menu"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden -fdata-sections -ffunction-sections"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

task packageMagiskModule(type: Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "ZygiskImGuiMenu-v1.0.0.zip"
    destinationDirectory = file("${project.rootDir}/out")

    // Magisk module configuration files
    from("${project.rootDir}/module") {
        include 'module.prop'
        include 'customize.sh'
        include 'META-INF/**'
    }

    // Embed compiled libzygisk.so binaries into correct zygisk layout
    def abis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    abis.each { abi ->
        def cmoduleObjDir = file("${buildDir}/intermediates/cxx/Release")
        def nativeLib = file("${buildDir}/intermediates/stripped_native_libs/release/out/lib/${abi}/libzygisk.so")
        if (!nativeLib.exists()) {
            nativeLib = file("${buildDir}/intermediates/cmake/release/obj/${abi}/libzygisk.so")
        }

        // Standard Magisk v24-26 Zygisk binary structure
        from(nativeLib.parentFile) {
            include 'libzygisk.so'
            into "zygisk/${abi}"
        }
        from(nativeLib.parentFile) {
            include 'libzygisk.so'
            into "zygisk"
            rename 'libzygisk.so', "${abi}.so"
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease') {
        task.finalizedBy packageMagiskModule
    }
}
