plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universal.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        applicationId "com.universal.zygisk.imgui"
        minSdk 24
        targetSdk 33
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fdata-sections -ffunction-sections"
                arguments "-DANDROID_STL=c++_static"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        exclude '**/*.so'
    }
}

// Custom task to pack the compiled native shared libraries and module scripts into a flashable Magisk zip module
tasks.register('zipModule', Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "zygisk-imgui-menu.zip"
    destinationDirectory = file("${buildDir}/outputs")

    // Root module config and scripts
    from("src/main/module") {
        include "module.prop"
        include "customize.sh"
        include "service.sh"
    }

    // Packaging compiled native shared libraries into zygisk/<abi>/libzygisk.so
    into("zygisk/arm64-v8a") {
        from fileTree(dir: "${buildDir}", include: "**/arm64-v8a/libzygisk.so")
        eachFile { it.path = it.name }
    }
    into("zygisk/armeabi-v7a") {
        from fileTree(dir: "${buildDir}", include: "**/armeabi-v7a/libzygisk.so")
        eachFile { it.path = it.name }
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        finalizedBy 'zipModule'
    }
}
