plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden -DANDROID"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        exclude '**/*'
    }
}

task zipModule(type: Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "zygisk-imgui-menu.zip"
    destinationDirectory = file("${project.buildDir}/outputs/zip")

    // Copy template files
    from("src/main/template")

    // Ensure native libraries compiled by CMake are packed into zygisk/<abi>/libzygisk.so and zygisk/<abi>.so
    ['arm64-v8a', 'armeabi-v7a'].each { abi ->
        from("build/target_libs/${abi}") {
            include "libzygisk.so"
            into "zygisk/${abi}"
        }
        from("build/target_libs/${abi}") {
            include "libzygisk.so"
            rename "libzygisk.so", "${abi}.so"
            into "zygisk"
        }
    }
}

tasks.afterEvaluate {
    if (tasks.findByName('packageReleaseModule')) {
        packageReleaseModule.dependsOn zipModule
    } else {
        assemble.finalizedBy zipModule
    }
}
