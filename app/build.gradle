plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        minSdk 24
        targetSdk 33

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

task buildMagiskModule(type: Zip, dependsOn: ['assembleRelease']) {
    archiveFileName = 'zygisk-imgui-touch-fix-magisk.zip'
    destinationDirectory = file("$buildDir/outputs/magisk")

    // Create module structure
    from("$projectDir/src/main/magisk") {
        include 'module.prop', 'post-fs-data.sh', 'service.sh', 'action.sh'
    }
    
    // Package compiled native shared library correctly into zygisk/<abi>/libzygisk.so
    into('zygisk/arm64-v8a') {
        from("$buildDir/intermediates/cmake/release/obj/arm64-v8a/libzygisk.so",
             "$buildDir/intermediates/stripped_native_libs/release/out/lib/arm64-v8a/libzygisk.so",
             "$buildDir/outputs/cmake/release/obj/arm64-v8a/libzygisk.so")
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    into('zygisk/armeabi-v7a') {
        from("$buildDir/intermediates/cmake/release/obj/armeabi-v7a/libzygisk.so",
             "$buildDir/intermediates/stripped_native_libs/release/out/lib/armeabi-v7a/libzygisk.so",
             "$buildDir/outputs/cmake/release/obj/armeabi-v7a/libzygisk.so")
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'bundleReleaseAar' || task.name == 'assembleRelease') {
        task.finalizedBy('buildMagiskModule')
    }
}
