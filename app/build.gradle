android {
    // ...
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

task zipModule(type: Zip) {
    archiveFileName = "UniversalTouchFix.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")
    from("module_assets") {
        include "module.prop", "customize.sh"
    }
    from("$buildDir/intermediates/cmake/release/obj") {
        into "zygisk"
        include "**/*.so"
    }
}
