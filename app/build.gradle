plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

tasks.register('packageMagiskModule', Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "zygisk_imgui_menu.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    from(projectDir) {
        include 'module.prop'
        include 'customize.sh'
    }

    into('zygisk/arm64-v8a') {
        from fileTree(dir: "$buildDir/intermediates", include: '**/arm64-v8a/libzygisk.so')
        eachFile { path = 'libzygisk.so' }
    }
    into('zygisk/armeabi-v7a') {
        from fileTree(dir: "$buildDir/intermediates", include: '**/armeabi-v7a/libzygisk.so')
        eachFile { path = 'libzygisk.so' }
    }
    into('zygisk/x86') {
        from fileTree(dir: "$buildDir/intermediates", include: '**/x86/libzygisk.so')
        eachFile { path = 'libzygisk.so' }
    }
    into('zygisk/x86_64') {
        from fileTree(dir: "$buildDir/intermediates", include: '**/x86_64/libzygisk.so')
        eachFile { path = 'libzygisk.so' }
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        finalizedBy 'packageMagiskModule'
    }
    tasks.named('assembleDebug').configure {
        finalizedBy 'packageMagiskModule'
    }
}
