plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        minSdk 24
        targetSdk 33
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

task packageMagiskModule(type: Zip) {
    dependsOn 'assembleRelease'

    archiveFileName.set("zygisk-imgui-menu.zip")
    destinationDirectory.set(file("${rootDir}/out"))

    // Copy module properties and scripts
    from("${projectDir}/src/main/module")

    // Package built shared libraries into zygisk/<abi>/libzygisk.so
    def abiList = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    abiList.each { abi ->
        into("zygisk/${abi}") {
            from(fileTree(dir: "${buildDir}", include: "**/lib/${abi}/libzygisk.so"))
            from(fileTree(dir: "${buildDir}", include: "**/${abi}/libzygisk.so"))
            eachFile { path = "libzygisk.so" }
        }
    }
}

tasks.matching { it.name == 'assemble' || it.name == 'build' || it.name == 'assembleRelease' }.configureEach {
    it.finalizedBy('packageMagiskModule')
}
