plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.zygiskimgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.zygiskimgui"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_static"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Custom task to package the Magisk Module
tasks.register('packageMagiskModule', Zip) {
    dependsOn 'externalNativeBuildRelease'
    
    archiveFileName = "Zygisk-ImGui-Universal.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    // Magisk template files (module.prop, service.sh, etc.)
    from('src/main/resources/magisk_template')
    
    // Package the compiled Zygisk binaries into the correct structure
    into('zygisk/arm64-v8a') {
        from "${project.buildDir}/intermediates/cmake/release/obj/arm64-v8a/libzygisk.so"
    }
    into('zygisk/armeabi-v7a') {
        from "${project.buildDir}/intermediates/cmake/release/obj/armeabi-v7a/libzygisk.so"
    }

    doLast {
        println "Magisk module created at: ${destinationDirectory.get()}/${archiveFileName.get()}"
    }
}
