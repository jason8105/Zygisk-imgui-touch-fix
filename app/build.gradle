plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fvisibility-inlines-hidden -Wall"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        prefab false
    }
}

tasks.register('packageMagiskModule', Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName.set("Zygisk-Universal-ImGui-v1.0.0.zip")
    destinationDirectory.set(file("${project.rootDir}/out"))

    from(file("${project.rootDir}/module.prop"))
    from(file("${project.rootDir}/customize.sh"))

    def abis = ['arm64-v8a', 'armeabi-v7a']
    abis.each { abi ->
        // Standard path 1: zygisk/<abi>/libzygisk.so
        into("zygisk/${abi}") {
            from("${buildDir}/intermediates/cxx/Release") {
                include "**/${abi}/libzygisk.so"
                eachFile { it.path = "libzygisk.so" }
            }
            from("${buildDir}/intermediates/cmake/release/obj/${abi}") {
                include "libzygisk.so"
            }
        }
        
        // Standard path 2: zygisk/<abi>.so
        into("zygisk") {
            from("${buildDir}/intermediates/cxx/Release") {
                include "**/${abi}/libzygisk.so"
                eachFile { it.path = "${abi}.so" }
            }
            from("${buildDir}/intermediates/cmake/release/obj/${abi}") {
                include "libzygisk.so"
                eachFile { it.path = "${abi}.so" }
            }
        }
    }
}

tasks.named('build').configure {
    finalizedBy 'packageMagiskModule'
}
