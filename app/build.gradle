plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        exclude '**/*.so'
    }
}

task packageMagiskModule(type: Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "zygisk-imgui-release.zip"
    destinationDirectory = file("${project.rootDir}/out")

    // Copy module prop and shell scripts
    from("${projectDir}/src/main/assets") {
        include "module.prop"
        include "service.sh"
        include "post-fs-data.sh"
        include "system/**"
    }

    // Process and copy native binaries for all supported ABIs
    def abis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    abis.each { abi ->
        def candidateFiles = fileTree(dir: "${buildDir}/intermediates", include: "**/lib/${abi}/libzygisk.so")
                .plus(fileTree(dir: "${buildDir}/intermediates", include: "**/${abi}/libzygisk.so"))

        from(candidateFiles) {
            into "zygisk/${abi}"
            rename { "libzygisk.so" }
        }
        from(candidateFiles) {
            into "zygisk"
            rename { "${abi}.so" }
        }
    }
}

tasks.afterEvaluate {
    packageMagiskModule.mustRunAfter('externalNativeBuildRelease')
    assembleRelease.finalizedBy(packageMagiskModule)
}
