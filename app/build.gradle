plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui.menu'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

afterEvaluate {
    tasks.register('zipModule', Zip) {
        dependsOn 'assembleRelease'

        archiveFileName.set("zygisk-imgui-menu.zip")
        destinationDirectory.set(file("${rootDir}/out"))

        from("${rootDir}/module") {
            include "module.prop"
            include "customize.sh"
            include "service.sh"
            include "system.prop"
        }

        into('zygisk') {
            from("${buildDir}/intermediates/stripped_native_libs/release/out/lib") {
                include "**/*.so"
            }
            from("${buildDir}/intermediates/merged_native_libs/release/out/lib") {
                include "**/*.so"
            }
        }
    }

    tasks.named('assemble').configure {
        finalizedBy('zipModule')
    }
}
