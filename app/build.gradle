plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imguitouchfix'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imguitouchfix"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

task buildMagiskModule(type: Zip) {
    dependsKey = 'assembleRelease'
    dependsOn 'assembleRelease'
    
    archiveFileName = "Zygisk-ImGui-TouchFix-Module.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    from("$projectDir/src/main/magisk") {
        include "module.prop"
        include "customize.sh"
        include "post-fs-data.sh"
        include "service.sh"
    }

    into("zygisk") {
        from("$buildDir/intermediates/cmake/release/obj") {
            include "arm64-v8a/*.so"
            include "armeabi-v7a/*.so"
            include "x86/*.so"
            include "x86_64/*.so"
        }
    }
}
