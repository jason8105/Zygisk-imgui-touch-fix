plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.menu'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden -fdata-sections -ffunction-sections"
                cFlags "-fdata-sections -ffunction-sections"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

task packageMagiskModule(type: Zip) {
    dependsOn 'externalNativeBuildRelease', 'assembleRelease'

    archiveFileName = "zygisk-universal-imgui.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    from(project.rootDir) {
        include 'module.prop'
        include 'customize.sh'
    }

    def abis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    
    abis.each { abi ->
        def nativeDir = file("$buildDir/intermediates/stripped_native_libs/release/out/lib/$abi")
        if (!nativeDir.exists()) {
            nativeDir = file("$buildDir/intermediates/merged_native_libs/release/out/lib/$abi")
        }
        if (!nativeDir.exists()) {
            nativeDir = file("$buildDir/intermediates/cmake/release/obj/$abi")
        }

        // Pack into zygisk/<abi>/libzygisk.so as required by specs
        from(nativeDir) {
            include 'libzygisk.so'
            into "zygisk/$abi"
        }

        // Also pack into zygisk/<abi>.so for backwards compatibility
        from(nativeDir) {
            include 'libzygisk.so'
            rename 'libzygisk.so', "${abi}.so"
            into "zygisk"
        }
    }
}

tasks.afterEvaluate {
    assembleRelease.finalizedBy(packageMagiskModule)
}
