plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '25.1.8937393'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}

task buildMagiskModule(type: Zip) {
    dependsOn 'assembleRelease'
    archiveFileName = 'zygisk-imgui-touch-fix.zip'
    destinationDirectory = file("$buildDir/outputs/magisk")

    // Base Magisk module structure
    from("$projectDir/src/main/magisk") {
        include 'module.prop'
        include 'post-fs-data.sh'
        include 'service.sh'
        include 'action.sh'
    }

    // Include compiled native libraries into zygisk directory structure
    from("$buildDir/intermediates/cmake/release/obj") {
        into 'zygisk'
        include '**/libzygisk.so'
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'bundleRelease' || task.name == 'assembleRelease') {
        task.finalizedBy 'buildMagiskModule'
    }
}
