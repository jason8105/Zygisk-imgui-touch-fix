plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygiskgui.mod'
    compileSdk 33

    defaultConfig {
        applicationId "com.zygiskgui.mod"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
}

task buildMagiskModule(type: Zip, dependsOn: 'assembleRelease') {
    archiveFileName = "Zygisk-ImGui-Universal.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    def stripPath = android.defaultConfig.externalNativeBuild.cmake.abiFilters

    // Create module structure
    from("$projectDir/src/main/magisk") {
        include "module.prop"
        include "post-fs-data.sh"
        include "service.sh"
        include "action.sh"
    }

    // Pack compiled binaries into zygisk/<abi>/libzygisk.so
    into("zygisk") {
        from("$buildDir/intermediates/cmake/release/obj") {
            include "**/libzygisk.so"
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease') {
        task.finalizedBy('buildMagiskModule')
    }
}
