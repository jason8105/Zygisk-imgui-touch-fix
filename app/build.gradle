plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisktouch.mod'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisktouch.mod"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

import org.apache.tools.zip.ZipEntry
import org.apache.tools.zip.ZipOutputStream

task buildMagiskModule(type: Zip) {
    dependsOn 'assembleRelease'
    archiveFileName = "Zygisk-ImGui-TouchFix-Module.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    from("$projectDir/src/main/magisk") {
        include "module.prop"
        include "customize.sh"
        include "post-fs-data.sh"
        include "service.sh"
    }

    into("zygisk") {
        from("$buildDir/intermediates/cmake/release/obj") {
            include "armeabi-v7a/libzygisk.so"
            include "arm64-v8a/libzygisk.so"
            include "x86/libzygisk.so"
            include "x86_64/libzygisk.so"
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'bundleRelease' || task.name == 'assembleRelease') {
        task.finalizedBy('buildMagiskModule')
    }
}
