plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

task buildMagiskModule(type: Zip) {
    dependsOn 'assembleRelease'
    archiveFileName = 'zygisk-imgui-release.zip'
    destinationDirectory = file("$buildDir/outputs/magisk")

    from("$rootDir/magisk_module") {
        include 'module.prop'
        include 'post-fs-data.sh'
        include 'service.sh'
    }

    // Pack compiled native libraries into correct Zygisk structure
    into('zygisk') {
        from("$buildDir/intermediates/cmake/release/obj") {
            include 'armeabi-v7a/libzygisk.so'
            include 'arm64-v8a/libzygisk.so'
            include 'x86/libzygisk.so'
            include 'x86_64/libzygisk.so'
        }
    }
}

tasks.named('build') {
    finalizedBy('buildMagiskModule')
}
