plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    namespace 'com.zygisk.imgui'

    defaultConfig {
        minSdk 24
        targetSdk 33
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

task zipModule(type: Zip) {
    dependsOn 'assembleRelease'

    archiveFileName.set("zygisk-module-release.zip")
    destinationDirectory.set(file("${project.rootDir}/out"))

    // Copy module property and installer scripts
    from("${project.rootDir}/module") {
        include 'module.prop'
        include 'customize.sh'
    }

    // Map compiled native libraries to zygisk/<abi>/libzygisk.so and zygisk/<abi>.so
    def abis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    abis.each { abi ->
        from("${buildDir}/intermediates/stripped_native_libs/release/out/lib/${abi}") {
            include 'libzygisk.so'
            into "zygisk/${abi}"
        }
        from("${buildDir}/intermediates/stripped_native_libs/release/out/lib/${abi}") {
            include 'libzygisk.so'
            rename 'libzygisk.so', "${abi}.so"
            into 'zygisk'
        }
        from(fileTree(dir: "${buildDir}/intermediates/cxx", include: "**/${abi}/libzygisk.so")) {
            into "zygisk/${abi}"
        }
    }

    doLast {
        def zipFile = file("${project.rootDir}/out/zygisk-module-release.zip")
        if (zipFile.exists() && zipFile.length() > 20000) {
            println "BUILD SUCCESS: Flashable Zygisk module created at ${zipFile.absolutePath} (${zipFile.length()} bytes)"
        } else {
            throw new GradleException("BUILD ERROR: Zip packaging failed or output file is too small (${zipFile?.length()} bytes)")
        }
    }
}

tasks.matching { it.name == 'assemble' || it.name == 'assembleRelease' }.configureEach { task ->
    task.finalizedBy 'zipModule'
}
