plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.zygiskmenu'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.zygiskmenu"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden -O3"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

tasks.register('zipModule', Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "zygisk-module.zip"
    destinationDirectory = file("$buildDir/outputs")

    // Zip root metadata files from project directory
    from(projectDir) {
        include 'module.prop'
        include 'customize.sh'
        include 'service.sh'
    }

    // Packaging compiled binaries into both zygisk/<abi>/libzygisk.so and zygisk/<abi>.so
    def abiList = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    abiList.each { abi ->
        def foundLibs = fileTree(dir: "$buildDir/intermediates", include: "**/$abi/libzygisk.so").files
        if (!foundLibs.isEmpty()) {
            def libFile = foundLibs.first()
            from(libFile) {
                into "zygisk/$abi"
            }
            from(libFile) {
                rename { "${abi}.so" }
                into "zygisk"
            }
        }
    }
}

afterEvaluate {
    tasks.named("assembleRelease").configure {
        finalizedBy("zipModule")
    }
}
