plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

tasks.register('zip', Zip) {
    dependsOn 'assembleRelease'

    archiveFileName = "zygisk-imgui-menu.zip"
    destinationDirectory = file("$buildDir/outputs")

    from("${projectDir}/../module") {
        include 'module.prop'
        include 'customize.sh'
        include 'service.sh'
    }

    into('zygisk') {
        ['arm64-v8a', 'armeabi-v7a'].each { abi ->
            def soFiles = fileTree(dir: "$buildDir", include: "**/${abi}/libzygisk.so").files
            if (!soFiles.isEmpty()) {
                from(soFiles.first()) {
                    rename 'libzygisk.so', "${abi}.so"
                }
            }
        }
    }
}

tasks.named('assembleRelease').configure {
    finalizedBy 'zip'
}
