plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

task buildMagiskModule(type: Zip) {
    dependsOn 'assembleRelease'
    archiveFileName = 'zygisk-imgui-release.zip'
    destinationDirectory = file("$buildDir/outputs/magisk")

    // Create module structure
    from("$rootDir/module_template") {
        exclude 'zygisk'
    }

    // Include compiled native libraries into zygisk directory structure
    // ABIs: arm64-v8a, armeabi-v7a, x86, x86_64
    into("zygisk/arm64-v8a") {
        from("$buildDir/intermediates/cmake/release/obj/arm64-v8a/libzygisk.so")
    }
    into("zygisk/armeabi-v7a") {
        from("$buildDir/intermediates/cmake/release/obj/armeabi-v7a/libzygisk.so")
    }
    into("zygisk/x86") {
        from("$buildDir/intermediates/cmake/release/obj/x86/libzygisk.so")
    }
    into("zygisk/x86_64") {
        from("$buildDir/intermediates/cmake/release/obj/x86_64/libzygisk.so")
    }
}
