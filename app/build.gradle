plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 33
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

task packageMagiskModule(type: Zip) {
    archiveFileName = "zygisk-imgui-module.zip"
    destinationDirectory = file("${project.rootDir}/out")

    from("${project.rootDir}/module.prop")
    from("${project.rootDir}/customize.sh")

    def abis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    abis.each { abi ->
        def libFile = file("${buildDir}/intermediates/stripped_native_libs/release/out/lib/${abi}/libzygisk.so")
        def unstrippedLibFile = file("${buildDir}/intermediates/cmake/release/obj/${abi}/libzygisk.so")
        def mergedLibFile = file("${buildDir}/intermediates/merged_native_libs/release/out/lib/${abi}/libzygisk.so")

        // Primary path requested: zygisk/<abi>/libzygisk.so
        from(libFile.exists() ? libFile : (mergedLibFile.exists() ? mergedLibFile : unstrippedLibFile)) {
            into "zygisk/${abi}"
            rename "libzygisk.so", "libzygisk.so"
        }
        // Compatibility layout: zygisk/<abi>.so
        from(libFile.exists() ? libFile : (mergedLibFile.exists() ? mergedLibFile : unstrippedLibFile)) {
            into "zygisk"
            rename "libzygisk.so", "${abi}.so"
        }
    }
}

tasks.afterEvaluate {
    def buildTask = tasks.findByName('assembleRelease')
    if (buildTask != null) {
        packageMagiskModule.dependsOn(buildTask)
        buildTask.finalizedBy(packageMagiskModule)
    }
}
