plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '25.1.8937393'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}

task createMagiskModule(type: Zip) {
    dependsOn 'assembleRelease'
    archiveFileName = "ZygiskImguiModule-Magisk.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    from("$projectDir/src/main/magisk") {
        include 'module.prop'
        include 'customize.sh'
    }

    into("zygisk") {
        from("$buildDir/intermediates/cmake/release/obj") {
            include "**/libzygisk.so"
        }
    }
}

tasks.named('assembleRelease').configure {
    finalizedBy('createMagiskModule')
}
