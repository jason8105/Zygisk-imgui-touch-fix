plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zygisk.mod'
    compileSdk 33
    defaultConfig {
        minSdk 24
        externalNativeBuild {
            cmake { cppFlags "-std=c++17" }
        }
    }
    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" }
    }
}

task buildMagiskModule(type: Zip) {
    archiveFileName = "UniversalImGuiModule.zip"
    destinationDirectory = file("$buildDir/outputs/zip")
    from("$projectDir/src/main/magisk")
    
    // Dynamically inject compiled libs from CMake output
    from("$buildDir/intermediates/cmake/debug/obj") {
        into "zygisk"
    }
}
