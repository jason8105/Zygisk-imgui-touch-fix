plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universal.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.universal.zygisk.imgui"
        minSdk 26
        targetSdk 34
        versionCode 1000
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fdata-sections -ffunction-sections"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        exclude '**/*.so'
    }
}

task packageMagiskModule(type: Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "Zygisk_ImGui_Universal_v1.0.0.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    // Root module files (module.prop, customize.sh, service.sh)
    from("${projectDir}/src/main/module") {
        into ''
    }

    // Include output zygisk native shared libraries under zygisk/<abi>/libzygisk.so
    from("${projectDir}/src/main/module_out/zygisk") {
        into 'zygisk'
    }

    doFirst {
        file("$buildDir/outputs/magisk").mkdirs()
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease' || task.name == 'assemble') {
        task.finalizedBy packageMagiskModule
    }
}
