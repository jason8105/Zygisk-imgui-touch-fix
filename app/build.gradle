plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui.menu'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui.menu"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fvisibility-inlines-hidden -fdata-sections -ffunction-sections"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        exclude '**/*.so'
    }
}

task makeZip(type: Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "zygisk-imgui-menu.zip"
    destinationDirectory = file("${buildDir}/outputs/zip")

    // Include module files (module.prop, customize.sh, etc.)
    from("${project.rootDir}/module")

    // Dynamically collect compiled libzygisk.so for all ABIs
    def abiList = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    abiList.each { abi ->
        from("${buildDir}/intermediates") {
            include "**/release/**/${abi}/libzygisk.so"
            include "**/Release/**/${abi}/libzygisk.so"
            eachFile { details ->
                details.path = "zygisk/${abi}/libzygisk.so"
            }
            includeEmptyDirs = false
        }
        from("${buildDir}/intermediates") {
            include "**/release/**/${abi}/libzygisk.so"
            include "**/Release/**/${abi}/libzygisk.so"
            eachFile { details ->
                details.path = "zygisk/${abi}.so"
            }
            includeEmptyDirs = false
        }
    }

    doFirst {
        println "Packing Zygisk module binaries into output ZIP..."
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease') {
        task.finalizedBy 'makeZip'
    }
}
