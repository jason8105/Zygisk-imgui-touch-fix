plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fvisibility-inlines-hidden -fdata-sections -ffunction-sections"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

tasks.register('packageMagiskModule', Zip) {
    dependsOn 'externalNativeBuildRelease'

    archiveFileName = "Zygisk-ImGui-UniversalTouch.zip"
    destinationDirectory = layout.buildDirectory.dir("outputs/zip")

    from(file("${projectDir}/src/main/module"))

    def abiList = ['arm64-v8a', 'armeabi-v7a']
    abiList.each { abi ->
        def libTree = fileTree(layout.buildDirectory) {
            include "**/obj/${abi}/libzygisk.so", "**/stripped_native_libs/**/${abi}/libzygisk.so", "**/merged_native_libs/**/${abi}/libzygisk.so"
        }
        into("zygisk/${abi}") {
            from(libTree)
            rename { 'libzygisk.so' }
        }
        into("zygisk") {
            from(libTree)
            rename { "${abi}.so" }
        }
    }
}

tasks.matching { it.name == 'assembleRelease' || it.name == 'build' }.configureEach {
    finalizedBy 'packageMagiskModule'
}
