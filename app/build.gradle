plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universal.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.universal.zygisk.imgui"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fomit-frame-pointer -O3"
                arguments "-DANDROID_STL=c++_static"
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    
    packagingOptions {
        doNotStrip "**/libzygisk.so"
    }
}

// Custom task to create the flashable Magisk zip
task packageMagiskModule(type: Zip) {
    archiveFileName = "UniversalZygiskImGui.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    // 1. Add module metadata
    from("src/main/resources") {
        include "module.prop"
        include "post-fs-data.sh"
        include "service.sh"
    }

    // 2. Add compiled Zygisk libraries to the correct Magisk structure
    // We iterate through built ABIs
    def abiList = ["arm64-v8a", "armeabi-v7a"]
    abiList.each { abi ->
        from("$buildDir/intermediates/cmake/release/obj/${abi}") {
            include "libzygisk.so"
            into "zygisk/${abi}"
        }
    }
}

// Ensure the zip task runs after the native build
afterEvaluate {
    packageMagiskModule.dependsOn assembleRelease
}
