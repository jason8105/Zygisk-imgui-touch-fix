plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universal.zygiskmenu'
    compileSdk 33

    defaultConfig {
        applicationId "com.universal.zygiskmenu"
        minSdk 24
        targetSdk 33
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

tasks.register('packageMagiskModule', Zip) {
    dependsOn 'assembleRelease'

    archiveFileName = "zygisk-module.zip"
    destinationDirectory = file("${project.rootDir}/out")

    // Copy module base configuration files
    from("${project.rootDir}/module") {
        exclude "zygisk"
    }

    // Include native shared libraries under zygisk/<abi>/libzygisk.so and zygisk/<abi>.so
    def abis = ['arm64-v8a', 'armeabi-v7a']
    abis.each { abi ->
        from("${project.rootDir}/module/zygisk/${abi}") {
            into "zygisk/${abi}"
        }
        from("${project.rootDir}/module/zygisk/${abi}") {
            include "libzygisk.so"
            rename { "${abi}.so" }
            into "zygisk"
        }
    }

    doFirst {
        file("${project.rootDir}/out").mkdirs()
    }
}

tasks.named('assemble').configure {
    finalizedBy('packageMagiskModule')
}
