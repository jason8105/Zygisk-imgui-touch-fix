plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '25.1.8937393'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
}

// Task to assemble Magisk module zip including the compiled shared libraries under zygisk/<abi>/libzygisk.so
task buildMagiskModule(type: Zip) {
    dependsOn 'assembleRelease'
    archiveFileName = 'zygisk-imgui-release.zip'
    destinationDirectory = file("$buildDir/outputs/magisk")

    // Base magisk structure
    from("$projectDir/src/main/magisk") {
        include 'module.prop'
        include 'customize.sh'
        include 'post-fs-data.sh'
        include 'service.sh'
    }

    // Map compiled native libraries to Zygisk ABIs
    into("zygisk/armeabi-v7a") {
        from "$buildDir/intermediates/cmake/release/obj/armeabi-v7a/libzygisk.so"
    }
    into("zygisk/arm64-v8a") {
        from "$buildDir/intermediates/cmake/release/obj/arm64-v8a/libzygisk.so"
    }
    into("zygisk/x86") {
        from "$buildDir/intermediates/cmake/release/obj/x86/libzygisk.so"
    }
    into("zygisk/x86_64") {
        from "$buildDir/intermediates/cmake/release/obj/x86_64/libzygisk.so"
    }
}

tasks.named('assemble') {
    finalizedBy 'buildMagiskModule'
}
