plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.zygisk.imgui'

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

task packageZygiskModule(type: Zip) {
    dependsOn 'externalNativeBuildRelease'
    archiveFileName = "zygisk-imgui-menu.zip"
    destinationDirectory = file("$rootDir/out")

    // Package module metadata & scripts
    from("${projectDir}/src/main/module")

    // Locate and package libzygisk.so for all target ABIs
    ['arm64-v8a', 'armeabi-v7a'].each { abi ->
        into("zygisk/${abi}") {
            from(fileTree(dir: "$buildDir", include: "**/lib/${abi}/libzygisk.so")) {
                eachFile { path = "libzygisk.so" }
            }
            from(fileTree(dir: "$buildDir", include: "**/obj/${abi}/libzygisk.so")) {
                eachFile { path = "libzygisk.so" }
            }
        }
        into("zygisk") {
            from(fileTree(dir: "$buildDir", include: "**/lib/${abi}/libzygisk.so")) {
                eachFile { path = "${abi}.so" }
            }
            from(fileTree(dir: "$buildDir", include: "**/obj/${abi}/libzygisk.so")) {
                eachFile { path = "${abi}.so" }
            }
        }
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        finalizedBy tasks.named('packageZygiskModule')
    }
}
