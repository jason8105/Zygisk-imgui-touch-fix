plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.zygiskimgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.zygiskimgui"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_shared"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

android.applicationVariants.all { variant ->
    def variantName = variant.name.capitalize()
    def zipTask = tasks.register("packageMagiskModule${variantName}", Zip) {
        dependsOn variant.externalNativeBuildTasks
        
        from("src/main/resources") {
            include "module.prop"
            include "verify.sh"
        }

        // Map the compiled libs to the Zygisk directory structure
        def buildOutDir = file("${project.buildDir}/intermediates/cmake/${variant.name}/obj")
        
        into("zygisk/arm64-v8a") {
            from("${buildOutDir}/arm64-v8a/libzygisk.so")
        }
        into("zygisk/armeabi-v7a") {
            from("${buildOutDir}/armeabi-v7a/libzygisk.so")
        }
        
        archiveFileName = "Zygisk-ImGui-${variant.name}.zip"
        destinationDirectory = file("${project.buildDir}/outputs/magisk")
    }
}
