android {
    // ... existing config
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

task copyZygiskLib(type: Copy) {
    from("$buildDir/intermediates/cmake/release/obj")
    into("$rootDir/module/zygisk")
    include("**/libzygisk.so")
}

assembleRelease.finalizedBy(copyZygiskLib)
