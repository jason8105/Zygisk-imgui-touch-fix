plugins {
    id 'com.android.library'
}

android {
    compileSdk 33
    ndkVersion "25.2.9519653"

    defaultConfig {
        minSdk 24
        targetSdk 33
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17", "-fvisibility=hidden", "-fomit-frame-pointer", "-O3"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
}

task packageMagiskModule(type: Zip) {
    archiveFileName = "Zygisk-ImGui-Universal.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    from(file("src/main/resources/module.prop"))
    from(file("src/main/resources/customize.sh"))
    
    // Package 64-bit
    into('zygisk') {
        from("${buildDir}/intermediates/cmake/release/obj/arm64-v8a/libimgui_menu.so")
        rename { "arm64-v8a.so" }
    }
    // Package 32-bit
    into('zygisk') {
        from("${buildDir}/intermediates/cmake/release/obj/armeabi-v7a/libimgui_menu.so")
        rename { "armeabi-v7a.so" }
    }
}

afterEvaluate {
    externalNativeBuildRelease.finalizedBy packageMagiskModule
}
