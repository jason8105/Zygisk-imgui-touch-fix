plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.zygisk_imgui'
    compileSdk 33

    defaultConfig {
        minSdk 24
        targetSdk 33
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    
    packagingOptions {
        doNotStrip "**/libzygisk.so"
    }
}

android.libraryVariants.all { variant ->
    def variantName = variant.name.capitalize()
    def zipTask = tasks.register("zip${variantName}", Zip) {
        archiveFileName = "Zygisk-ImGui-${variant.name}.zip"
        destinationDirectory = file("$buildDir/outputs/module")

        // 1. Include module.prop
        from("${projectDir}/../module.prop")

        // 2. Include the compiled binaries in Zygisk structure
        // This fixes the "input_file_does_not_exist" by pointing exactly where CMake outputs
        variant.externalNativeBuildProviders.each { provider ->
            def cmakeTask = provider.get()
            dependsOn cmakeTask
            
            def objPath = cmakeTask.objFolder
            from(objPath) {
                into "zygisk"
                include "**/libzygisk.so"
            }
        }
        
        // Ensure folder structure is zygisk/<abi>/libzygisk.so
        rename { String fileName ->
            if (fileName.contains("libzygisk.so")) {
                return fileName.replace("libzygisk.so", "libzygisk.so")
            }
            return fileName
        }
    }
}
