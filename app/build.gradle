plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 33

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

task buildMagiskModule(type: Zip) {
    dependsOn 'assembleRelease'

    archiveFileName = "ZygiskImguiModule.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    from("$projectDir/src/main/magisk") {
        include 'module.prop'
        include 'customize.sh'
        include 'post-fs-data.sh'
    }

    // Pack compiled native libraries into correct Zygisk structure
    into("zygisk") {
        from("$buildDir/intermediates/cmake/release/obj") {
            include "**/libzygisk.so"
        }
    }
}

tasks.named('assembleRelease').configure {
    finalizedBy('buildMagiskModule')
}
