plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.zygiskimgui'
    compileSdk 33

    defaultConfig {
        minSdk 24
        targetSdk 33
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.register('zipModule', Zip) {
    dependsOn 'externalNativeBuildRelease'
    
    archiveFileName = "Zygisk-ImGui-Universal.zip"
    destinationDirectory = file("$buildDir/outputs/magisk")

    // Magisk metadata files
    from(file("src/main/resources")) {
        include "module.prop"
        include "verify.sh"
        include "service.sh"
        include "uninstall.sh"
    }

    // Process the binaries for each ABI
    def abiList = ['arm64-v8a', 'armeabi-v7a']
    abiList.each { abi ->
        from(file("$buildDir/intermediates/cmake/release/obj/${abi}/libzygisk.so")) {
            into "zygisk/${abi}"
        }
    }
    
    // Ensure standard Magisk structure
    into("/")
}
