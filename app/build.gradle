plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        applicationId "com.zygisk.imgui"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fvisibility=hidden"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

task packageMagiskModule(type: Zip) {
    dependsOn 'assembleRelease'

    archiveFileName = 'zygisk-module.zip'
    destinationDirectory = file("${rootDir}/out")

    from("${rootDir}/module") {
        include 'module.prop'
        include 'customize.sh'
    }

    // Map compiled libzygisk.so for all target ABIs into zygisk/<abi>/libzygisk.so and zygisk/<abi>.so
    ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].each { abi ->
        def found = false
        fileTree(dir: "${buildDir}", include: "**/lib/${abi}/libzygisk.so").each { soFile ->
            if (!found) {
                from(soFile) {
                    into "zygisk/${abi}"
                    rename { "libzygisk.so" }
                }
                from(soFile) {
                    into "zygisk"
                    rename { "${abi}.so" }
                }
                found = true
            }
        }
    }

    doLast {
        println "Zygisk flashable module created successfully at: ${destinationDirectory.get()}/${archiveFileName.get()}"
    }
}

tasks.matching { it.name == 'assembleRelease' || it.name == 'assemble' }.configureEach { task ->
    task.finalizedBy packageMagiskModule
}
