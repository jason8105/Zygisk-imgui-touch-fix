plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygisk.imgui'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden -O3"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        exclude '**/*'
    }
}

android.applicationVariants.all { variant ->
    def variantName = variant.name.capitalize()
    
    def zipTask = tasks.register("packageMagiskModule${variantName}", Zip) {
        dependsOn "externalNativeBuild${variantName}"
        
        archiveFileName = "Zygisk-ImGui-Universal-${variant.name}.zip"
        destinationDirectory = file("${project.buildDir}/outputs/magisk")

        // Pack module root structure
        from("${project.rootDir}/module") {
            include "module.prop"
            include "customize.sh"
            include "service.sh"
            include "system/**"
        }

        // Pack native libraries under zygisk/<abi>/libzygisk.so
        ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"].each { abi ->
            into("zygisk/${abi}") {
                from({
                    def possiblePaths = [
                        "${project.buildDir}/intermediates/stripped_native_libs/${variant.name}/strip${variantName}DebugSymbols/out/lib/${abi}",
                        "${project.buildDir}/intermediates/stripped_native_libs/${variant.name}/out/lib/${abi}",
                        "${project.buildDir}/intermediates/merged_native_libs/${variant.name}/out/lib/${abi}",
                        "${project.buildDir}/intermediates/cmake/${variant.name}/obj/${abi}"
                    ]
                    def found = possiblePaths.find { file("${it}/libzygisk.so").exists() }
                    return found ? file(found) : file("${project.buildDir}/intermediates/cmake/${variant.name}/obj/${abi}")
                })
                include "libzygisk.so"
            }
        }
    }

    tasks.named("assemble${variantName}").configure {
        finalizedBy(zipTask)
    }
}
